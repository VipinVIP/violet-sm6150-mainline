# UCM2 profile for the Xiaomi Redmi Note 7 Pro (violet, SM6150) on mainline Linux.
#
# Playback: one front-end PCM per output, each permanently routed to its back-end in the
# verb (a PCM only opens once a back-end is routed, and the audio server opens the PCM
# before it enables the device):
#   Speaker    MultiMedia3 (hw:N,2) -> PRIMARY_MI2S_RX -> TAS2563 amplifier
#   Headphones MultiMedia4 (hw:N,3) -> RX_CODEC_DMA_RX_0 -> rx_macro -> SoundWire (swr1) -> WCD9375 HPHL/HPHR
# Capture: MultiMedia2 (hw:N,1) <- TX_CODEC_DMA_TX_3 <- tx_macro <- WCD9375 ADC1 (AMIC1).
#
# Headphones is selected automatically by the audio server when the codec's MBHC
# reports a plug: "Headphone Jack" is the kcontrol that snd_soc_jack creates.

SectionVerb {
	# Both playback back-ends stay routed for the whole verb: the audio server opens a
	# device's PCM before enabling the device, and a front-end PCM only opens once a
	# back-end is routed to it.  Nothing is active until a stream actually runs.
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia4' 1"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 20"
		cset "name='TX_DEC0 Volume' 100"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia4' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	Value {
		PlaybackPriority 100
		# MultiMedia4, not 3: MM3->codec-DMA produces no audio on this firmware,
		# MM4 does (verified by ear 2026-11-06).  The jack route is switched at the
		# mixer level by violet-jack-watch.
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "3.5 mm headphones"

	ConflictingDevice [
		"Speaker"
	]

	# The WCD9375 companders must stay off: a 2-channel stream carries no compander
	# control data on SoundWire data port 3, which gates the DAC output (silence).
	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]

	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX HPH Mode' CLS_H_INVALID"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}

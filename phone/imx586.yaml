# violet (Redmi Note 7 Pro) rear Sony IMX586 (Ofilm module).
# CCMs come from the vendor Chromatix tuning (tuned_ofilm_imx586.bin, cc13 table, first AEC set), one matrix per
# CCT trigger range: 1-2450 K, 2800-3000 K, 3600-4200 K, 4700-5300 K, 5800-10000 K. Black level = 64/1023 raw.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2450
          ccm: [ 1.7686, -0.8055,  0.0369,
                -0.2172,  1.5123, -0.2951,
                 0.0093, -0.6578,  1.6485 ]
        - ct: 2900
          ccm: [ 1.5113, -0.4085, -0.1028,
                -0.2367,  1.3580, -0.1213,
                -0.0255, -0.9020,  1.9275 ]
        - ct: 3900
          ccm: [ 1.5076, -0.4465, -0.0611,
                -0.2193,  1.3285, -0.1092,
                 0.0172, -0.8099,  1.7927 ]
        - ct: 5000
          ccm: [ 1.5950, -0.5476, -0.0474,
                -0.2585,  1.4128, -0.1543,
                 0.0629, -0.6156,  1.5527 ]
        - ct: 6500
          ccm: [ 1.6068, -0.6956,  0.0888,
                -0.1712,  1.2050, -0.0339,
                 0.0182, -0.7230,  1.7048 ]
  - Adjust:
  - Agc:
...

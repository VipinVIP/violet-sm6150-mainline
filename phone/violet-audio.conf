# violet audio routing configuration, read by /usr/local/bin/violet-hph
# (the jack watcher calls that script, so editing this file changes behaviour immediately).

# PulseAudio sink volume applied when switching TO each route, in percent.
# Keep both at 100 so the on-screen bar sits at maximum; the loudness difference
# between speaker and headphones is made in the codec instead (below).
jack_volume=100
speaker_volume=100

# Headphone codec gain.  These two are what set the maximum headphone loudness
# when the slider is at 100 %:
#   jack_hph_gain        PA gain, 0..20   (higher = louder)
#   jack_digital_volume  RX digital, 0..124, 1 dB per step, 124 = +40 dB, 84 = -40 dB
# 12/94 is roughly the level that was comfortable at PA 55 % with 12/110.
jack_hph_gain=12
jack_digital_volume=94

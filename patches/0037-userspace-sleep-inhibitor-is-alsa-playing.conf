# 0037 - userspace: let audio playing inhibit idle suspend on violet
#
# Plan item 4 requires "with music playing it must not suspend".  Measured 2026-11-02 on
# build #183: it DID suspend ~65 s into a 190 s audio stream.  Cause: pmOS ships a
# sleep_inhibitor plugin for exactly this, `is-alsa-playing`
#     grep -qF 'state: RUNNING' /proc/asound/card*/pcm*/sub*/status && exit 254
# but /etc/sleep-inhibitor.conf only enables `ssh-session-open` and `apk-running`, so nothing
# ever inhibited sleep for audio.
#
# Fix: add the plugin to /etc/sleep-inhibitor.conf and restart the service.
# Verified: with audio playing, `elogind-inhibit --list` shows
#     sleep-inhibitor 0 root <pid> elogind-inhibit sleep ... Plugin ALSA playing   block
# and a 150 s run with sleep-inactive-*=suspend (60 s) produced zero new suspend entries.
#
# Install:
#   cp /etc/sleep-inhibitor.conf /etc/sleep-inhibitor.conf.bak
#   cat >> /etc/sleep-inhibitor.conf <<'EOF'
#
#     - path: is-alsa-playing
#       name: ALSA playing
#       period: .1
#       what: sleep
#   EOF
#   rc-service sleep-inhibitor restart
#
# (period .1 = the plugin is re-checked every 6 s; it holds a *block* inhibitor while the
# ALSA substream is RUNNING, so audio cannot be cut off by the idle timer.)
